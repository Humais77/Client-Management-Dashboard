<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient for the main N shape -->
    <linearGradient id="nexBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>

    <!-- Gradient for the growth/management accent -->
    <linearGradient id="nexGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Subtle drop shadow for depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#002255" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Optional Background Plate (Remove <rect> if you want a transparent background) -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <g filter="url(#shadow)" transform="translate(0,0)">
    <!-- Left Pillar of N -->
    <path d="M 128 140 C 128 122.325 142.325 108 160 108 L 160 108 C 177.675 108 192 122.325 192 140 L 192 372 C 192 389.675 177.675 404 160 404 L 160 404 C 142.325 404 128 389.675 128 372 Z" fill="url(#nexBlue)" />

    <!-- Diagonal Growth Bar connecting to Right Peak -->
    <path d="M 160 380 L 332 152 C 339.5 142 353.5 139 364.5 145.5 L 364.5 145.5 C 376 152.5 379.5 167.5 372 178 L 220 380 C 208 396 182 396 170 380 Z" fill="url(#nexGreen)" />

    <!-- Right Upward Arrow / Pillar -->
    <path d="M 320 220 L 320 372 C 320 389.675 334.325 404 352 404 L 352 404 C 369.675 404 384 389.675 384 372 L 384 140 C 384 120 360 108 344 124 L 320 150 Z" fill="url(#nexBlue)" opacity="0.9" />

    <!-- Dashboard Node / Client Connection Dot -->
    <circle cx="352" cy="128" r="32" fill="#00E5A3" />
  </g>
</svg>
